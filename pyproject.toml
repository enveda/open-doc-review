[project]
name = "open-doc-review"
version = "0.1.0"
description = "Advisory AI document review that bolts onto any content-management system (ECM)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
box = ["box-sdk-gen>=1.17"]
sharepoint = ["httpx>=0.27"]

[project.scripts]
docreview = "docreview.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "box-sdk-gen>=1.17", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docreview"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
